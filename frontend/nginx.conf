# nginx fronts both the built SPA and the API on one origin.
#
# Serving them same-origin means the browser never makes a cross-origin
# request, so CORS is not part of the production path at all - the backend's
# CORS settings exist only for `npm run dev`, where Vite proxies instead.

upstream drift_api {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite emits content-hashed asset filenames, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://drift_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # An evaluation is synchronous and scores every golden query, so the
        # default 60s proxy timeout is too tight for a large golden set.
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # The interactive API docs are useful from the same origin as the UI.
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://drift_api;
        proxy_set_header Host $host;
    }

    # Client-side routing: any unknown path is a React route, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, or a deploy leaves clients pinned to
    # asset URLs that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
